name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Check release version and build host
        run: |
          python3 - <<'PY'
          import os, platform, re
          from pathlib import Path
          from xml.etree import ElementTree
          tag = os.environ["RELEASE_TAG"]
          assert re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag), "Invalid release tag"
          assert platform.system() == "Darwin" and platform.machine() == "arm64", "Apple Silicon runner required"
          assert f"project(kindle_rss VERSION {tag[1:]} LANGUAGES CXX)" in Path("native-rss/CMakeLists.txt").read_text()
          assert ElementTree.parse("native-rss/device/kual/config.xml").findtext("information/version") == tag[1:]
          PY

      - name: Install host test dependencies
        run: |
          brew install cmake pkgconf libxml2 sqlite curl freetype webp aom sdl2
          printf 'PKG_CONFIG_PATH=%s/native-rss/build-host-media/prefix/lib/pkgconfig:%s/lib/pkgconfig:%s/lib/pkgconfig:%s/lib/pkgconfig\n' \
            "$GITHUB_WORKSPACE" "$(brew --prefix libxml2)" "$(brew --prefix sqlite)" "$(brew --prefix curl)" >> "$GITHUB_ENV"

      - name: Build host AVIF with libyuv scaling
        run: |
          python3 - <<'PY'
          import json, shutil, sys
          from pathlib import Path
          sys.path.insert(0, "native-rss/tools")
          from build_arm import LOGS, ROOT, UNPACKED, download, run, source_tree
          LOGS.mkdir(parents=True, exist_ok=True)
          UNPACKED.mkdir(parents=True, exist_ok=True)
          lock = json.loads((ROOT / "tools/arm-sources.json").read_text())
          trees = {name: source_tree(name, lock[name], download(name, lock[name])) for name in ("libyuv", "libavif")}
          build = ROOT / "build-host-media"
          prefix = build / "prefix"
          run(["cmake", "-S", str(trees["libyuv"]), "-B", str(build / "yuv"), "-DCMAKE_BUILD_TYPE=Release", "-DUNIT_TEST=OFF", "-DLIBYUV_DISABLE_JPEG=ON"])
          run(["cmake", "--build", str(build / "yuv"), "--target", "yuv", "-j", "3"])
          (prefix / "lib").mkdir(parents=True, exist_ok=True)
          shutil.copy2(build / "yuv/libyuv.a", prefix / "lib/libyuv.a")
          shutil.copytree(trees["libyuv"] / "include", prefix / "include", dirs_exist_ok=True)
          run(["cmake", "-S", str(trees["libavif"]), "-B", str(build / "avif"), "-DCMAKE_BUILD_TYPE=Release", f"-DCMAKE_INSTALL_PREFIX={prefix}", f"-DCMAKE_PREFIX_PATH={prefix}", "-DAVIF_CODEC_AOM=SYSTEM", "-DAVIF_CODEC_AOM_DECODE=ON", "-DAVIF_CODEC_AOM_ENCODE=OFF", "-DAVIF_CODEC_DAV1D=OFF", "-DAVIF_LIBYUV=SYSTEM", "-DAVIF_BUILD_APPS=OFF", "-DAVIF_BUILD_TESTS=OFF", "-DAVIF_JPEG=OFF", "-DAVIF_ZLIBPNG=OFF"])
          run(["cmake", "--build", str(build / "avif"), "-j", "3"])
          run(["cmake", "--install", str(build / "avif")])
          PY

      - name: Build and test on the host
        run: |
          cmake -S native-rss -B native-rss/build -DCMAKE_BUILD_TYPE=Debug
          cmake --build native-rss/build -j 3
          ctest --test-dir native-rss/build --output-on-failure

      - name: Install pinned Zig compiler
        run: |
          curl --fail --location --retry 3 \
            https://ziglang.org/download/0.15.2/zig-aarch64-macos-0.15.2.tar.xz \
            --output "$RUNNER_TEMP/zig.tar.xz"
          printf '3cc2bab367e185cdfb27501c4b30b1b0653c28d9f73df8dc91488e66ece5fa6b  %s\n' \
            "$RUNNER_TEMP/zig.tar.xz" | shasum -a 256 --check
          mkdir -p native-rss/vendor
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C native-rss/vendor

      - name: Compile ARM and prepare release assets
        run: |
          python3 native-rss/tools/build_arm.py
          python3 native-rss/tools/release.py "$RELEASE_TAG"

      - name: Verify release archives
        run: |
          python3 - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path
          tag = os.environ["RELEASE_TAG"]
          folder = Path("native-rss/output") / f"release-{tag}"
          with zipfile.ZipFile(folder / f"RSS-Reader-{tag}-KPW3.zip") as device, zipfile.ZipFile(folder / f"RSS-Reader-{tag}-source.zip") as source:
              manifest = json.loads(device.read("native-rss/MANIFEST.json"))["files"]
              assert set(device.namelist()) == set(manifest) | {"native-rss/MANIFEST.json"}
              for name, digest in manifest.items():
                  assert hashlib.sha256(device.read(name)).hexdigest() == digest, name
              assert hashlib.sha256(device.read("native-rss/bin/kindle-rss")).hexdigest() == json.loads(device.read("native-rss/BUILD.json"))["binary_sha256"]
              assert device.read("native-rss/LICENSE") == source.read("LICENSE") == Path("LICENSE").read_bytes()
              for name in manifest:
                  if name.startswith("native-rss/licenses/"):
                      assert device.read(name) == source.read(name), name
              for archive in (device, source):
                  for name in archive.namelist():
                      parts = Path(name).parts
                      assert not set(parts) & {"data", "vendor", "output", "__pycache__"}, name
                      assert not any(part.startswith("build") and "." not in part for part in parts), name
                      assert not name.endswith((".sqlite", ".opml", ".log")), name
          PY
          cd "native-rss/output/release-$RELEASE_TAG"
          shasum -a 256 --check SHA256SUMS.txt

      - name: Publish release after all checks pass
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag --target "$RELEASE_COMMIT" --draft \
            --title "RSS Reader $RELEASE_TAG" --notes-file CHANGELOG.md \
            "native-rss/output/release-$RELEASE_TAG/RSS-Reader-$RELEASE_TAG-KPW3.zip" \
            "native-rss/output/release-$RELEASE_TAG/RSS-Reader-$RELEASE_TAG-source.zip" \
            "native-rss/output/release-$RELEASE_TAG/SHA256SUMS.txt"
          gh release edit "$RELEASE_TAG" --draft=false --latest
