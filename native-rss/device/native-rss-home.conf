# RSS Reader optional home card v1
start on starting kppmainapp
stop on stopping kppmainapp
respawn
respawn limit 3 60

pre-start script
    # Failure must leave the original homepage available, including after an OTA.
    timeout 20 sh /mnt/us/native-rss/home.sh mount || logger -t native-rss-home 'home adapter skipped'
end script

exec /mnt/us/native-rss/bin/kindle-rss-home --db /mnt/us/native-rss/data/rss.sqlite --session-lock /var/local/native-rss/session.lock --state /var/local/native-rss/home/health serve

post-stop script
    timeout 10 sh /mnt/us/native-rss/home.sh unmount || true
end script
